<div id="chart"></div>
<p>
  <button type="button" id="last-week">Last 7 days</button>
  <button type="button" id="all">Everything</button>
</p>
<p><output id="range">Showing everything.</output></p>
<p><output id="picked">Press Enter on a point, or click one, to select it.</output></p>

<script type="module">
  import { line } from 'axylo';

  /** @param {string} id */
  const byId = id => {
    const element = document.getElementById(id);
    if (!element) throw new Error(`#${id} is missing from the page`);
    return element;
  };

  const rows = Array.from({ length: 31 }, (_, i) => ({
    day: `2026-03-${String(i + 1).padStart(2, '0')}`,
    sessions: Math.round(3000 + 30 * i + 400 * Math.sin(i / 1.3)),
  }));
  const chart = line('#chart', { title: 'Daily sessions, March', data: rows, x: 'day', y: 'sessions' });

  // `zoom` sets the visible x range in the axis's own form; null shows everything.
  byId('last-week').addEventListener('click', () => chart.zoom(['2026-03-25', '2026-03-31']));
  byId('all').addEventListener('click', () => chart.zoom(null));

  // On a calendar-date axis the event gives dates as 'YYYY-MM-DD', the form zoom() takes.
  chart.on('zoom', window => {
    byId('range').textContent = window ? `Showing ${window[0]} to ${window[1]}.` : 'Showing everything.';
  });
  chart.on('select', point => {
    byId('picked').textContent = `Selected ${point.series} on ${point.x}: ${point.y ?? 'no data'} (row ${point.index}).`;
  });
</script>
