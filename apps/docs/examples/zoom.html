<div id="chart"></div>
<p>
  <button type="button" id="last-week">Last 7 days</button>
  <button type="button" id="all">Everything</button>
</p>
<p><output id="range">Showing everything.</output></p>
<p><output id="picked">Press Enter on a point, or click one, to select it.</output></p>

<script type="module">
  import { line } from 'axylo';

  const rows = Array.from({ length: 31 }, (_, i) => ({
    day: `2026-03-${String(i + 1).padStart(2, '0')}`,
    sessions: Math.round(3000 + 30 * i + 400 * Math.sin(i / 1.3)),
  }));
  const chart = line('#chart', { title: 'Daily sessions, March', data: rows, x: 'day', y: 'sessions' });

  const range = document.querySelector('#range');
  const picked = document.querySelector('#picked');
  /**
   * Events give dates as epoch milliseconds; a calendar date is its UTC midnight.
   * @param {string | number | Date} value
   */
  const day = value => new Date(value).toISOString().slice(0, 10);

  // `zoom` sets the visible x range; null shows everything. The buttons, a drag, the keys
  // + - 0 and the toolbar all end in the same 'zoom' event.
  document.querySelector('#last-week').addEventListener('click', () => chart.zoom(['2026-03-25', '2026-03-31']));
  document.querySelector('#all').addEventListener('click', () => chart.zoom(null));

  chart.on('zoom', window => {
    range.textContent = window ? `Showing ${day(window[0])} to ${day(window[1])}.` : 'Showing everything.';
  });
  chart.on('select', point => {
    picked.textContent = `Selected ${point.series} on ${day(point.x)}: ${point.y ?? 'no data'} (row ${point.index}).`;
  });
</script>
